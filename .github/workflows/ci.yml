name: PDE Simulation Studio CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-scientific-and-security-tests:
    name: Backend FastAPI + NGSolve 3D FEM + Security Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install OpenCASCADE / Netgen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1 libgomp1

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Unit, Scientific Validation, Security, and E2E Tests
        working-directory: backend
        run: |
          python -m pytest -v

  frontend-tests-and-build:
    name: Frontend TypeScript + Vitest + Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Unit & Component Tests
        working-directory: frontend
        run: npm test

      - name: Build Production Frontend Bundle
        working-directory: frontend
        run: npm run build

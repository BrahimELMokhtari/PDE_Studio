[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pde-simulation-studio-backend"
version = "3.0.0"
description = "Phase 3 Production Backend API & NGSolve 3D FEM Engine for PDE Simulation Studio"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.1",
    "ngsolve>=6.2.2405",
    "netgen-mesher>=6.2.2405",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "redis>=5.0.0",
    "rq>=1.16.0",
    "fakeredis>=2.21.0",
    "PyJWT>=2.8.0",
    "boto3>=1.34.0",
    "psycopg[binary]>=3.1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

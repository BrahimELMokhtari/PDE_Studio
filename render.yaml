# Render Blueprint (Infrastructure-as-Code) for PDE Simulation Studio
# Deploys:
# 1. Frontend Static Site (React + TypeScript + Three.js)
# 2. Backend API Web Service (FastAPI + Pydantic + OIDC Auth)
# 3. Numerical Engine Background Worker (NGSolve + Netgen OpenCASCADE + RQ)
# 4. Managed Redis-compatible Queue Service (Render Key Value)
# 5. Managed PostgreSQL Production Database

services:
  # 1. Frontend Static Site
  - type: web
    name: pde-simulation-studio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

  # 2. Backend FastAPI Web Service (Independently Scalable API Tier)
  - type: web
    name: pde-simulation-studio-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: PDE Simulation Studio API
      - key: APP_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: pde-simulation-studio-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pde-simulation-studio-redis
          property: connectionString
      - key: RQ_QUEUE_NAME
        value: pde_simulations
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: OIDC_ISSUER_URL
        sync: false
      - key: OIDC_AUDIENCE
        value: pde-simulation-studio-api
      - key: OIDC_JWKS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: MAX_REQUEST_BODY_BYTES
        value: "2097152"
      - key: MAX_PROJECTS_PER_USER
        value: "50"
      - key: MAX_SIMULATION_JOBS_PER_USER
        value: "100"
      - key: MAX_STORAGE_BYTES_PER_USER
        value: "524288000"

  # 3. Numerical Engine Background Worker (Independently Scalable NGSolve FEM Worker)
  - type: worker
    name: pde-simulation-studio-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.worker
    dockerContext: ./backend
    plan: standard
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pde-simulation-studio-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pde-simulation-studio-redis
          property: connectionString
      - key: RQ_QUEUE_NAME
        value: pde_simulations
      - key: JOB_TIMEOUT_SECONDS
        value: "180"
      - key: MAX_MESH_ELEMENTS
        value: "250000"
      - key: MAX_INLINE_SURFACE_TRIANGLES
        value: "15000"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: us-east-1

  # 4. Managed Redis-Compatible Queue Service
  - type: redis
    name: pde-simulation-studio-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # 5. Managed PostgreSQL Production Database
  - name: pde-simulation-studio-db
    databaseName: pde_simulation_studio
    user: pde_studio_user
    plan: basic-256mb
